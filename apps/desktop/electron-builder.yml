# Installers: an arm64 DMG for Apple silicon Macs (`pnpm dist:mac`, on a Mac), an x64 NSIS installer
# for Windows 11 (`pnpm dist:win`, on Windows), and an x64 AppImage and deb for Linux
# (`pnpm dist:linux`, on Linux). The release workflow builds all of them, and the Microsoft Store
# package, an x64 MSIX (`pnpm dist:msix`, on Windows), for dry runs and stable releases.
# Fixed from the first release on: macOS updates and Keychain access, and Windows installs, are
# tied to it. Letters only, so Android and iOS accept the same id.
appId: app.mrstreamer.player
productName: Mr. Streamer
copyright: Copyright © 2026 Wout Stiens
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
electronLanguages: [en]
# Every release carries latest*.yml update files, nightly or not: the app picks the release
# itself, so the files need no channel in their names.
detectUpdateChannel: false
# The ffmpeg that converts streams the player cannot decode, built by scripts/build-ffmpeg.sh.
extraResources:
  - from: vendor/ffmpeg/${os}-${arch}
    to: ffmpeg
# Keeps Chromium's credits, which hold Node.js's licence too, in Mac builds. See the script.
afterExtract: ./scripts/mac-credits.ts
# Seals Mac builds with an ad hoc signature, so they open without a Developer ID. See the script.
afterPack: ./scripts/mac-ad-hoc-sign.ts

mac:
  # The DMG is the download; the zip is what in-app updates install.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.entertainment
  icon: build/icon.icns
  # Signs with a Developer ID from the login keychain when one exists; otherwise the afterPack
  # hook's ad hoc signature stays.
  # Notarization runs only when APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Mr-Streamer-${version}-mac-${arch}.${ext}
  # The helper that plays on AirPlay receivers, built by scripts/build-airplay-helper.sh. It is
  # signed with the app, and the app asks for the local network in its name.
  extraResources:
    - from: vendor/airplay/mac-${arch}
      to: airplay
  extendInfo:
    NSLocalNetworkUsageDescription: Mr. Streamer plays on TVs and speakers on your network.
# The window takes its size from the background, which `pnpm dmg:background` renders.
dmg:
  title: Mr. Streamer
  background: build/dmg-background.png
  iconSize: 132
  iconTextSize: 13
  sign: true
  contents:
    - { x: 190, y: 210, type: file }
    - { x: 470, y: 210, type: link, path: /Applications }

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Mr-Streamer-${version}-win-${arch}-setup.${ext}
nsis:
  # Per-user install into %LOCALAPPDATA%, no admin prompt. Uninstalling keeps the login and preferences.
  oneClick: true
  perMachine: false
  shortcutName: Mr. Streamer
  deleteAppDataOnUninstall: false
  # elevate.exe only helps updates of per-machine installs, so it stays out of the app.
  packElevateHelper: false
# The Microsoft Store package, an MSIX of the same app; docs/maintainers/releasing.md describes it.
# The identity is the one Partner Center reserved for the app, exactly as its Product identity page
# shows it. The application id names the app inside the package, and with the identity makes the id
# Windows pins and groups it by: neither may change once the Store has the app. Logos come from
# build/appx (`pnpm icons:export`).
appx:
  identityName: MrStreamerOSS.Mr.Streamer
  publisher: CN=A132E842-C4C9-40BF-83C4-D304E7952C2D
  # No period, on purpose: Partner Center doesn't allow one in the publisher's name.
  publisherDisplayName: Mr Streamer OSS
  # The name the Store lists the app under, one Partner Center reserved. electron-builder writes it
  # as the package's name and as its Start entry's, so Windows shows it for an installed Store copy.
  # The product, its .exe, its window and its data folder keep "Mr. Streamer".
  displayName: "Mr. Streamer: IPTV Player"
  applicationId: MrStreamer
  backgroundColor: "#000000"
  languages: [en-US]
  # Windows 11, as for the installer.
  minVersion: 10.0.22000.0
  maxVersionTested: 10.0.26100.0
  artifactName: Mr-Streamer-${version}-win-${arch}.msix
# The Store's numbering differs from the release version; the script explains it.
appxManifestCreated: ./scripts/msix-version.ts

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  # Desktop environments match the window to the menu entry by this name.
  syncDesktopName: true
  icon: build/icon.png
  synopsis: A clean, fast, open-source IPTV player for macOS, Windows and Linux.
  maintainer: Wout Stiens <hello@mrstreamer.app>
  artifactName: Mr-Streamer-${version}-linux-${arch}.${ext}
deb:
  # electron-builder's defaults, plus ALSA, which Chromium loads at start and minimal systems lack.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
