name: Secretless validation
description: Validate the checked-out source. Caller checks out source and trusted action separately; no secrets required.
inputs:
  part:
    description: check, test or website
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      if: inputs.part == 'check'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"
        cache: pnpm
      if: inputs.part == 'check'
    - run: pnpm install --frozen-lockfile
      shell: bash
      if: inputs.part == 'check'
    - name: Unused code
      run: pnpm knip
      shell: bash
      if: inputs.part == 'check'
    - name: Lint
      run: pnpm lint
      shell: bash
      if: inputs.part == 'check'
    - name: Format
      run: pnpm fmt:check
      shell: bash
      if: inputs.part == 'check'
    - name: Typecheck
      run: pnpm typecheck
      shell: bash
      if: inputs.part == 'check'
    - name: Workflows
      run: pnpm actionlint
      shell: bash
      if: inputs.part == 'check'
    - name: Build
      run: pnpm build
      shell: bash
      if: inputs.part == 'check'
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      if: inputs.part == 'test'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"
        cache: pnpm
      if: inputs.part == 'test'
    - run: pnpm install --frozen-lockfile
      shell: bash
      if: inputs.part == 'test'
    - id: test-multimedia-key
      run:
        'sources=$(find /etc/apt/sources.list.d -type f -exec sha256sum {} + | sha256sum | cut -d'' '' -f1)

        echo "key=test-ffmpeg-${ImageOS}-${ImageVersion}-$(date -u +%G-W%V)-$sources" >> "$GITHUB_OUTPUT"

        '
      shell: bash
      if: inputs.part == 'test'
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: "${{ runner.temp }}/ffmpeg-packages/*.deb

          ${{ runner.temp }}/ffmpeg-packages/SHA256SUMS

          "
        key: ${{ steps.test-multimedia-key.outputs.key }}-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh') }}
      if: inputs.part == 'test'
    - name: Multimedia tools
      run: bash apps/desktop/scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-packages"
      shell: bash
      if: inputs.part == 'test'
    - name: Test
      run: pnpm test --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/test-results.json"
      shell: bash
      if: inputs.part == 'test'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && inputs.part == 'test'
      with:
        name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/test-results.json
        retention-days: "7"
        if-no-files-found: warn
    - name: Require complete test results
      if: always() && inputs.part == 'test'
      run: node scripts/ci-test-results.ts "$RUNNER_TEMP/test-results.json"
      shell: bash
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      if: inputs.part == 'website'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"
        cache: pnpm
      if: inputs.part == 'website'
    - run: pnpm install --frozen-lockfile --filter mrstreamer-marketing...
      shell: bash
      if: inputs.part == 'website'
    - name: Build
      run: pnpm --filter mrstreamer-marketing build
      shell: bash
      if: inputs.part == 'website'
    - name: Validation contracts
      if: inputs.part == 'check'
      shell: bash
      run: node --test .github/tests/*.test.ts
    - name: Validation types
      if: inputs.part == 'check'
      shell: bash
      run: pnpm exec tsc --ignoreConfig --noEmit --target esnext --module nodenext --types node --strict --allowImportingTsExtensions --skipLibCheck .github/scripts/*.ts .github/tests/*.ts
