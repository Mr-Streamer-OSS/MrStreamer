# One part of Checks' validation on the checked-out source; README.md has the caller contract.
name: Secretless validation
description: Validate the checked-out source. Caller checks out source and trusted action separately; no secrets required.

inputs:
  part:
    description: check, test, test-shards (merges test shards' reports) or website
    required: true

  shard:
    description: With part test, run only this Vitest shard of `shards`, numbered from 1; part test-shards merges them
    default: ""

  shards:
    description: How many shards the suite is split into, with `shard`
    default: ""

  build:
    description: Production build; release fallback uses its required final versioned bundle instead
    default: "true"

  report-name:
    description: Unique report label for callers validating more than one candidate
    default: ${{ github.run_id }}

outputs:
  identity:
    description: Effective validation identity observed on this job's runner
    # Merged shards keep theirs only when every shard and this runner share it.
    value: ${{ inputs.part != 'test-shards' && steps.identity.outputs.identity || steps.shards.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Require a validation part
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: |
        case "$PART" in
          check|test|test-shards|website) ;;
          *) echo "Unknown validation part: $PART" >&2; exit 1 ;;
        esac
    # Keep the complete distro toolchain. A different runner image or week gets fresh packages.
    - id: multimedia-key
      if: inputs.part == 'test'
      run: |
        sources=$(find /etc/apt/sources.list.d -type f -exec sha256sum {} + | sha256sum | cut -d' ' -f1)
        echo "key=test-ffmpeg-${ImageOS}-${ImageVersion}-$(date -u +%G-W%V)-$sources" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.part == 'test'
      with:
        path: |
          ${{ runner.temp }}/ffmpeg-packages/*.deb
          ${{ runner.temp }}/ffmpeg-packages/SHA256SUMS
        key: ${{ steps.multimedia-key.outputs.key }}-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh') }}
    # Installs alongside Node and the dependencies, which take about as long. Multimedia tools
    # waits for it, shows its output and fails with it.
    - name: Start multimedia tools
      if: inputs.part == 'test'
      run: |
        setup=$RUNNER_TEMP/ffmpeg-setup
        (
          set +e
          bash apps/desktop/scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-packages"
          echo $? > "$setup.result" && mv "$setup.result" "$setup.status"
        ) < /dev/null > "$setup.log" 2>&1 &
        echo $! > "$setup.pid"
      shell: bash
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - id: identity
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        identity=$(node "$ACTION_PATH/../../scripts/validation-evidence.ts" identity)
        [[ "$identity" =~ ^[a-f0-9]{64}$ ]]
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
    # The website installs only what it declares, as publishing does. Merging shards needs only the
    # root's Vitest.
    - run: pnpm install --frozen-lockfile ${{ inputs.part == 'website' && '--filter mrstreamer-marketing...' || inputs.part == 'test-shards' && '--filter mrstreamer-workspace' || '' }}
      shell: bash

    - name: Unused code
      if: inputs.part == 'check'
      run: pnpm knip
      shell: bash
    - name: Lint
      if: inputs.part == 'check'
      run: pnpm lint
      shell: bash
    - name: Format
      if: inputs.part == 'check'
      run: pnpm fmt:check
      shell: bash
    - name: Typecheck
      if: inputs.part == 'check'
      run: pnpm typecheck
      shell: bash
    - name: Workflows
      if: inputs.part == 'check'
      run: pnpm actionlint
      shell: bash
    - name: Build
      if: inputs.part == 'check' && inputs.build != 'false'
      run: pnpm build
      shell: bash
    - name: Locate trusted tools
      if: inputs.part == 'check'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: echo "VALIDATION_TOOLS=$(cd "$ACTION_PATH/../../.." && pwd)" >> "$GITHUB_ENV"
    - name: Validation contracts
      if: inputs.part == 'check'
      run: |
        cd "$VALIDATION_TOOLS"
        node --test .github/tests/*.test.ts
      shell: bash
    - name: Validation types
      if: inputs.part == 'check'
      run: pnpm exec tsc --ignoreConfig --noEmit --target esnext --module nodenext --types node --strict --allowImportingTsExtensions --skipLibCheck "$VALIDATION_TOOLS/.github/scripts/"*.ts "$VALIDATION_TOOLS/.github/tests/"*.ts
      shell: bash

    - name: Multimedia tools
      if: inputs.part == 'test'
      run: |
        setup=$RUNNER_TEMP/ffmpeg-setup
        while [[ ! -f "$setup.status" ]] && kill -0 "$(< "$setup.pid")" 2>/dev/null; do sleep 0.2; done
        cat "$setup.log"
        [[ -f "$setup.status" ]] && exit "$(< "$setup.status")"
        echo "The multimedia tools' installation stopped without a result." >&2
        exit 1
      shell: bash
    # The native fixture's media (apps/ios/scripts/native-fixtures/media.ts), encoded once per
    # package set and fixture source. Each piece's name hashes its command, inputs and ffmpeg, so
    # the fixture copies a kept piece only for the same command and encodes any other. A candidate
    # without FIXTURE_MEDIA_CACHE encodes as before and keeps nothing.
    - id: fixture-media
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.part == 'test'
      with:
        path: .local/fixture-media
        key: fixture-media-${{ steps.multimedia-key.outputs.key }}-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh', 'apps/ios/scripts/fixture-server.ts', 'apps/ios/scripts/native-fixtures/**', 'apps/desktop/test/fake-provider.ts', 'apps/desktop/test/fixtures/**') }}
    - name: Test
      if: inputs.part == 'test' && !inputs.shard
      env:
        FIXTURE_MEDIA_CACHE: ${{ github.workspace }}/.local/fixture-media
      run: pnpm test --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/test-results.json"
      shell: bash

    # One shard keeps Vitest's blob report and the identity it ran under, for test-shards to merge.
    # A rerun shard replaces its earlier attempt's artifact; each attempt's merged report keeps it.
    - name: Test shard
      if: inputs.part == 'test' && inputs.shard
      env:
        SHARD: ${{ inputs.shard }}/${{ inputs.shards }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        REPORT_NAME: ${{ inputs.report-name }}
        FIXTURE_MEDIA_CACHE: ${{ github.workspace }}/.local/fixture-media
      run: |
        mkdir -p "$RUNNER_TEMP/test-shard"
        jq -n --arg report "$REPORT_NAME" --arg shard "$SHARD" --arg identity "$IDENTITY" '{$report, $shard, $identity}' > "$RUNNER_TEMP/test-shard/shard.json"
        pnpm test --shard="$SHARD" --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob="$RUNNER_TEMP/test-shard/blob.json"
      shell: bash
    # Kept by the run that encoded it: only the shard running the native fixture has any.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.part == 'test' && steps.fixture-media.outputs.cache-hit != 'true' && hashFiles('.local/fixture-media/**') != ''
      with:
        path: .local/fixture-media
        key: ${{ steps.fixture-media.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && inputs.part == 'test' && inputs.shard
      with:
        name: test-shard-${{ inputs.report-name }}-${{ inputs.shard }}
        path: ${{ runner.temp }}/test-shard/
        retention-days: 7
        if-no-files-found: error
        overwrite: true

    # Every shard of this candidate, merged into the one report a whole run writes.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.part == 'test-shards'
      with:
        pattern: test-shard-${{ inputs.report-name }}-*
        path: ${{ runner.temp }}/test-shards
    - id: shards
      if: inputs.part == 'test-shards'
      env:
        ACTION_PATH: ${{ github.action_path }}
        IDENTITY: ${{ steps.identity.outputs.identity }}
        REPORT_NAME: ${{ inputs.report-name }}
      run: node "$ACTION_PATH/../../scripts/test-shards.ts" "$RUNNER_TEMP/test-shards" "$REPORT_NAME" "$RUNNER_TEMP/test-blobs" >> "$GITHUB_OUTPUT"
      shell: bash
    # Also each file's seconds, which test/sequencer.ts splits the shards by. The shards' logs
    # already show passed tests' output, so the merge shows only failed ones'.
    - name: Merge test shards
      if: always() && inputs.part == 'test-shards'
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pnpm test --merge-reports="$RUNNER_TEMP/test-blobs" --silent=passed-only --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/test-results.json" --reporter="$ACTION_PATH/../../../scripts/test-durations.ts" --outputFile.durations="$RUNNER_TEMP/test-durations.json"
      shell: bash

    # The report, to look into a failure or a slow file, and merged shards' durations. Missing
    # when the tests never ran, which the next step fails on.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && (inputs.part == 'test' && !inputs.shard || inputs.part == 'test-shards')
      with:
        name: test-results-${{ inputs.report-name }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/test-results.json
          ${{ runner.temp }}/test-durations.json
        retention-days: 7
        if-no-files-found: warn
    # Every test file in the report, each test passed: a suite that skipped for want of ffmpeg
    # fails here.
    - name: Require complete test results
      if: always() && (inputs.part == 'test' && !inputs.shard || inputs.part == 'test-shards')
      run: node scripts/ci-test-results.ts "$RUNNER_TEMP/test-results.json"
      shell: bash

    # The caller's read-only GH_TOKEN fetches release history.
    - name: Build
      if: inputs.part == 'website'
      run: pnpm --filter mrstreamer-marketing build
      shell: bash
