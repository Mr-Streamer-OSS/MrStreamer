# Sets up Release's bundle, packaging, source and UI-proof jobs: candidate dependencies and
# version, with the shared JS bundle unless this job builds it. Jobs load this action from
# the workflow commit's .workflow checkout so an older candidate uses the current release setup.
name: Set up a release job
description: Install the release commit's dependencies, stamp the version and take the JS bundle

inputs:
  version:
    description: The release version, such as 0.0.13 or 0.0.13-nightly.20261013.300
    required: true
  bundle:
    description: Take the js-bundle-<version> artifact into apps/desktop/out
    default: "true"

runs:
  using: composite
  steps:
    # The workflow's tools sit beside the release's checkout in .workflow. Kept out of what git
    # reports, the release UI receipt still finds the checkout holding nothing but the commit.
    - run: echo ".workflow/" >> "$(git rev-parse --git-path info/exclude)"
      shell: bash
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: npm pkg set version="$VERSION"
      shell: bash
      working-directory: apps/desktop
      env:
        VERSION: ${{ inputs.version }}
    - if: inputs.bundle == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: js-bundle-${{ inputs.version }}
        path: apps/desktop/out
