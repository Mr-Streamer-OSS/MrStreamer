# Weekly version updates, opened as normal pull requests for review.
# Options: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  # The root pnpm workspace covers the desktop, marketing and shared packages; the iOS and
  # Android apps keep their own installs and lockfiles (see pnpm-workspace.yaml).
  - package-ecosystem: npm
    directories:
      - /
      - /apps/ios
      - /apps/android
    schedule:
      interval: weekly
    groups:
      # Both stay pinned at the same exact version, so they move together.
      oxlint:
        patterns:
          - oxlint
          - "@oxlint/plugins"

  # "/" scans .github/workflows; composite actions each have their own action.yml.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
