# Checks every pull request and push to main. The release workflow runs the same jobs on the exact
# commit it releases.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Release checks get a group of their
# own, so they never wait for or cancel the checks of a pull request.
concurrency:
  group: ci-${{ inputs.ref && format('release-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unused code
        run: pnpm knip
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm fmt:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep the complete distro toolchain. A different runner image or week gets fresh packages.
      - id: multimedia-key
        run: |
          sources=$(find /etc/apt/sources.list.d -type f -exec sha256sum {} + | sha256sum | cut -d' ' -f1)
          echo "key=test-ffmpeg-${ImageOS}-${ImageVersion}-$(date -u +%G-W%V)-$sources" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ffmpeg-packages/*.deb
            ${{ runner.temp }}/ffmpeg-packages/SHA256SUMS
          key: ${{ steps.multimedia-key.outputs.key }}-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh') }}
      - name: Multimedia tools
        run: bash apps/desktop/scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-packages"
      - name: Test
        run: pnpm test --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/multimedia-results.json"
      - name: Require multimedia coverage
        if: always()
        run: node apps/desktop/scripts/ci-multimedia-results.ts "$RUNNER_TEMP/multimedia-results.json"
