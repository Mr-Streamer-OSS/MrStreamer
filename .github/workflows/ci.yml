# Checks every pull request and every push to main. The release workflow runs the same checks
# before it builds anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The conversion tests need ffmpeg, and ffprobe to check what the player would receive.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
