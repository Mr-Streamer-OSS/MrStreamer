# Keeps the maintainers' GitHub project in working order: puts a new draft in the Backlog, gives
# every release with unfinished work its own card, and numbers the Order field so open-work views
# list cards in the order to work on them. scripts/project-order.ts holds the rules, and
# docs/maintainers/project-order.md the setup.
#
# - Every hour, and by hand. A run started by hand reports what it would change and writes
#   nothing, unless "apply" is ticked.
# - Off until the repository variable PROJECT_ORDER_ENABLED is "true": until then the hourly run
#   is skipped and applying by hand is refused. A preview by hand works without it, to check the
#   setup before turning it on.
# - The project belongs to the organization, which this workflow's own token can't reach, so the
#   script reads and writes it with the secret PROJECT_AUTOMATION_TOKEN. The workflow's token
#   only reads the repository.
# - Only main runs: no pull request event starts this workflow, so no fork's code runs near the
#   secret, and a run started by hand from another branch does nothing.
# - It writes to the project alone. A release card is a list to tick off: nothing here builds,
#   publishes or submits a release.
name: Project order

on:
  schedule:
    # Past the hour, when fewer scheduled runs start.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Put new drafts in the Backlog, add release cards and write the Order values. Unticked, the run reports what it would change.
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, and none cancelled halfway through its writes. GitHub keeps one run waiting
# and drops an older one that waited, which loses nothing: every run looks at the whole project.
concurrency:
  group: project-order
  cancel-in-progress: false

jobs:
  order:
    name: Order the project
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PROJECT_ORDER_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
    steps:
      - name: Check the setup
        env:
          ENABLED: ${{ vars.PROJECT_ORDER_ENABLED == 'true' }}
          PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          if [ "$APPLY" = true ] && [ "$ENABLED" != true ]; then
            echo "::error::Project order is off, so nothing was written: the repository variable PROJECT_ORDER_ENABLED isn't true. Run this without apply for a preview."
            exit 1
          fi
          if [ -z "$PROJECT_AUTOMATION_TOKEN" ]; then
            echo "::error::The secret PROJECT_AUTOMATION_TOKEN is missing, so the project can't be read. Create it: docs/maintainers/project-order.md#setup"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Only this step and the check hold the secret. The script needs no packages installed.
      - name: Order the project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
        run: |
          args=()
          [ "$APPLY" = true ] && args+=(--apply)
          node scripts/project-order.ts "${args[@]}"
