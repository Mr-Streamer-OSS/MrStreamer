# The app's and the website's checks, on every pull request and push to main;
# docs/maintainers/ci.md shows how the workflows fit together.
#
# Check always runs and reports. Test and Website run when their inputs changed, and whenever the
# changed paths are unknown or couldn't be read. A release calls this with the commit it builds
# (`sha`), which always checks and tests that commit. The validation evidence artifact records
# what ran on the exact source; .github/actions/validation/README.md has its contract.
#
# Website checks here are secretless; the independent Website workflow owns deployment.
# No secrets, so pull requests from forks run all of it.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: The exact commit a release validates
        type: string
        required: true
      report-name:
        description: Unique report label for each candidate in the calling run
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request replaces its running checks. A release's checks get a group of
# their own, so they never wait for or cancel the checks of a pull request.
concurrency:
  group: >-
    checks-${{ inputs.sha && format('release-{0}-{1}', github.run_id, inputs.sha)
    || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.sha }}

jobs:
  inputs:
    name: Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      website: ${{ steps.paths.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: paths
        env:
          VALIDATION_SHA: ${{ inputs.sha }}
        run: node .github/scripts/ci-inputs.ts

  # Runs even when Inputs failed, and then fails itself, so the protected check always reports.
  check:
    name: Check
    needs: inputs
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: check
      - name: Require input selection
        env:
          INPUT_RESULT: ${{ needs.inputs.result }}
        run: test "$INPUT_RESULT" = success

  test:
    name: Test
    needs: inputs
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ !cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: test
          report-name: ${{ inputs.report-name || github.run_id }}

  # Paired trial on the same source as Test. Remove unless both decision gates pass.
  trial-test:
    name: Trial Test ${{ matrix.shard }}
    needs: inputs
    if: ${{ !cancelled() && !inputs.sha && (needs.inputs.result != 'success' || needs.inputs.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: test
          report-name: trial-${{ inputs.report-name || github.run_id }}-${{ matrix.shard }}
          test-shard: ${{ matrix.shard }}/2

  trial-union:
    name: Trial complete results
    needs: [inputs, trial-test]
    if: ${{ !cancelled() && needs.trial-test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-trial-${{ inputs.report-name || github.run_id }}-*-${{ github.run_attempt }}
          path: .local/trial-results
      - name: Validate union and shard verdicts
        env:
          SHARD_RESULT: ${{ needs.trial-test.result }}
        run: |
          node .github/scripts/check-test-shards.ts .local/trial-results "$RUNNER_TEMP/test-union.json"
          node scripts/ci-test-results.ts "$RUNNER_TEMP/test-union.json"
          test "$SHARD_RESULT" = success

  website:
    name: Website
    needs: inputs
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ !cancelled() && !inputs.sha && (needs.inputs.result != 'success' || needs.inputs.outputs.website != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        uses: ./.local/validation-tools/.github/actions/validation
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          part: website

  evidence:
    name: Validation evidence
    needs: [check, test, website]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - name: Record executed results
        env:
          CHECK_IDENTITY: ${{ needs.check.outputs.identity }}
          TEST_IDENTITY: ${{ needs.test.outputs.identity }}
          WEBSITE_IDENTITY: ${{ needs.website.outputs.identity }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: node .local/validation-tools/.github/scripts/validation-evidence.ts record "$RUNNER_TEMP/validation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ inputs.report-name || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 14
          if-no-files-found: error
