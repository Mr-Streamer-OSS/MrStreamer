# The app's and the website's checks, on every pull request and push to main;
# docs/maintainers/ci.md shows how the workflows fit together.
#
# Check always runs and reports. Test and Website run when their inputs changed, and whenever the
# changed paths are unknown or couldn't be read. A pull request that only adds or edits Markdown and
# images outside their inputs skips both; its Check checks formatting and documented paths. Test
# merges three test shards' reports. A release
# calls this with the commit it builds (`sha`), which always checks and tests that commit. The
# validation evidence artifact records what ran on the exact source;
# .github/actions/validation/README.md has its contract.
#
# Website checks here are secretless; the independent Website workflow owns deployment.
# No secrets, so pull requests from forks run all of it.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: The exact commit a release validates
        type: string
        required: true
      report-name:
        description: Unique report label for each candidate in the calling run
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request replaces its running checks. A release's checks get a group of
# their own, so they never wait for or cancel the checks of a pull request.
concurrency:
  group: >-
    checks-${{ inputs.sha && format('release-{0}-{1}', github.run_id, inputs.sha)
    || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.sha }}

jobs:
  inputs:
    name: Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      website: ${{ steps.paths.outputs.website }}
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: paths
        env:
          VALIDATION_SHA: ${{ inputs.sha }}
        run: node .github/scripts/ci-inputs.ts
      # Check's format and documentation-path shortcut: a pull request that selects neither Test nor Website and only
      # adds or edits Markdown and images. Other files, deletions and renames keep the full Check.
      - id: docs
        if: >-
          github.event_name == 'pull_request'
          && steps.paths.outputs.desktop == 'false' && steps.paths.outputs.website == 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE" "$HEAD")
          git diff --no-renames --name-status -z "$base" "$HEAD" > "$RUNNER_TEMP/changes"
          docs=false
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            if [[ $status =~ ^[AM]$ && ${path,,} =~ \.(md|png|jpe?g|gif|svg|webp)$ ]]; then
              docs=true
            else
              docs=false
              break
            fi
          done < "$RUNNER_TEMP/changes"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Runs even when Inputs failed, and then fails itself, so the protected check always reports.
  check:
    name: Check
    needs: inputs
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        if: needs.inputs.outputs.docs != 'true'
        uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: check
      # Markdown and images need formatting and documented-path checks, without the app build.
      - if: needs.inputs.outputs.docs == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: needs.inputs.outputs.docs == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Format
        if: needs.inputs.outputs.docs == 'true'
        run: |
          pnpm install --frozen-lockfile --filter mrstreamer-workspace
          pnpm fmt:check
          node scripts/docs-references.ts
      - name: Require input selection
        env:
          INPUT_RESULT: ${{ needs.inputs.result }}
        run: test "$INPUT_RESULT" = success

  # The suite runs in three shards side by side, each on its own runner as the whole suite ran.
  test-shard:
    name: Test shard ${{ matrix.shard }}
    needs: inputs
    if: ${{ !cancelled() && (needs.inputs.result != 'success' || needs.inputs.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard finishes, so a failure's report is complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: test
          shard: ${{ matrix.shard }}
          shards: ${{ strategy.job-total }}
          report-name: ${{ inputs.report-name || github.run_id }}

  # The required Test status: the shards' reports merged into one, held to the completeness gate.
  # It runs after a cancelled or failed shard too, so neither leaves Test skipped or green.
  test:
    name: Test
    needs: [inputs, test-shard]
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ always() && (needs.inputs.result != 'success' || needs.inputs.outputs.desktop != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A cancelled run has no report worth merging. A failed or timed-out shard still merges.
      - name: Require the shards to have run
        if: ${{ cancelled() || needs.test-shard.result == 'skipped' }}
        run: |
          echo "The test shards were cancelled or skipped, so Test can't pass." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        uses: ./.local/validation-tools/.github/actions/validation
        with:
          part: test-shards
          report-name: ${{ inputs.report-name || github.run_id }}
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARDS_RESULT" = success

  website:
    name: Website
    needs: inputs
    outputs:
      identity: ${{ steps.validate.outputs.identity }}
    if: ${{ !cancelled() && !inputs.sha && (needs.inputs.result != 'success' || needs.inputs.outputs.website != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - id: validate
        uses: ./.local/validation-tools/.github/actions/validation
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          part: website

  evidence:
    name: Validation evidence
    needs: [check, test, website]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .local/validation-tools
          persist-credentials: false
      - name: Record executed results
        env:
          CHECK_IDENTITY: ${{ needs.check.outputs.identity }}
          TEST_IDENTITY: ${{ needs.test.outputs.identity }}
          WEBSITE_IDENTITY: ${{ needs.website.outputs.identity }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: node .local/validation-tools/.github/scripts/validation-evidence.ts record "$RUNNER_TEMP/validation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ inputs.report-name || github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 14
          if-no-files-found: error
