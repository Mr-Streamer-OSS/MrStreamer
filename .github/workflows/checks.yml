# Always report Check; only omit expensive work for known independent inputs.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: The exact commit a release validates
        type: string
        required: true
      report-name:
        description: Legacy caller report label
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: >-
    checks-${{ inputs.sha && format('release-{0}-{1}', github.run_id, inputs.sha)
    || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.sha }}
jobs:
  inputs:
    name: Inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      website: ${{ steps.paths.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: paths
        env:
          VALIDATION_SHA: ${{ inputs.sha }}
        run: node .github/scripts/ci-inputs.ts
  check:
    name: Check
    needs: inputs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/validation
        with:
          part: check
      - name: Require input selection
        env:
          INPUT_RESULT: ${{ needs.inputs.result }}
        run: test "$INPUT_RESULT" = success
  test:
    name: Test
    needs: inputs
    if: always() && (needs.inputs.result != 'success' || needs.inputs.outputs.desktop == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/validation
        with:
          part: test
  website:
    name: Website
    needs: inputs
    if: always() && !inputs.sha && (needs.inputs.result != 'success' || needs.inputs.outputs.website == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validation
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          part: website
  evidence:
    name: Validation evidence
    needs: [inputs, check, test, website]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Record executed results
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: node .github/scripts/validation-evidence.ts record "$RUNNER_TEMP/validation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 14
          if-no-files-found: error
