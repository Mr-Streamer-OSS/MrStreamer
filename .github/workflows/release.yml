# Builds releases: macOS, Windows and Linux installers, installed-app smoke tests, update metadata,
# checksums and notes. docs/maintainers/releasing.md explains versions and the steps around it.
#
# - Nightly: every six hours when main has changed since the last nightly, or by hand. Published
#   as a pre-release once every check passes; the app's Nightly channel picks it up.
# - Stable: by hand. Created as a draft for a maintainer to test and publish. Afterwards main
#   moves on to the next minor version in a chore(release) commit, which later nightlies build.
# - Dry run: a pull request labelled "release dry run" builds, signs and tests the same way,
#   keeps the files as workflow artifacts and releases nothing.
name: Release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Stable version to release, such as 0.2.0. Empty uses the version on main.
        type: string
        required: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the version
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release dry run')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      dry-run: ${{ github.event_name == 'pull_request' }}
      skip: ${{ steps.changes.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Releases come from main
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run releases from main; use a pull request labelled \"release dry run\" to try a branch."
          exit 1
      # A scheduled nightly only builds when main changed since the last nightly. Version bumps
      # after a stable release don't count.
      - id: changes
        if: github.event_name == 'schedule'
        run: |
          last=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not))][0].tagName // empty')
          if [ -n "$last" ] && [ -z "$(git log --format=%s "$last..HEAD" | grep -v '^chore(release)')" ]; then
            echo "Nothing new on main since $last."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        if: steps.changes.outputs.skip != 'true'
        env:
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-plan.ts --channel "$CHANNEL" \
            --version "${VERSION:-$(node -p 'require("./package.json").version')}" \
            --run "${{ github.run_number }}"

  checks:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml

  package:
    name: Package ${{ matrix.target }}
    needs: [plan, checks]
    strategy:
      # Every platform reports its own result; the release still needs all of them.
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, runner: macos-15, builder: --mac --arm64 }
          - { target: win-x64, runner: windows-2025, builder: --win --x64 }
          - { target: linux-x64, runner: ubuntu-24.04, builder: --linux --x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The bundled ffmpeg, rebuilt only when scripts/build-ffmpeg.sh changes.
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build ffmpeg on Linux
        # Ubuntu 22.04, so the binary also runs on older systems.
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ubuntu:22.04 bash -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential nasm pkg-config git curl ca-certificates xz-utils >/dev/null &&
            scripts/build-ffmpeg.sh linux-x64 &&
            chown -R '"$(id -u):$(id -g)"' vendor'
      - name: Build ffmpeg on macOS
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install --quiet nasm pkg-config
          scripts/build-ffmpeg.sh mac-arm64
      - if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            make git curl mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Build ffmpeg on Windows
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh win-x64

      - run: npm pkg set version="$VERSION"
      - run: pnpm build

      - name: Build for macOS, signed and notarized
        if: runner.os == 'macOS'
        env:
          # Dry runs happen on this repository's own labelled pull requests, so they sign too.
          CSC_FOR_PULL_REQUEST: "true"
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::The $name secret is missing; see docs/maintainers/signing.md"; exit 1; }
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          pnpm exec electron-builder ${{ matrix.builder }} --publish never
          node scripts/notarize-dmg.ts dist/*.dmg
          rm -f "$APPLE_API_KEY"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app="dist/mac-arm64/Mr. Streamer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID"
          codesign -dv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"
          spctl --assess --type execute --verbose "$app"
          spctl --assess --type open --context context:primary-signature --verbose dist/*.dmg
          xcrun stapler validate "$app"
          xcrun stapler validate dist/*.dmg

      # Windows installers are unsigned for now. Signing belongs here, as its own step with its
      # own secrets, without touching the Mac certificate; docs/maintainers/signing.md.
      - name: Build for Windows
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: Build for Linux
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: Check the update metadata
        run: |
          for file in dist/latest*.yml; do
            grep -qx "version: $VERSION" "$file" || { echo "::error::$file does not name $VERSION"; exit 1; }
          done

      - name: Smoke test the installed app on macOS
        if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach -nobrowse -readonly dist/*.dmg | tail -1 | cut -f3)
          ditto "$mount/Mr. Streamer.app" "/Applications/Mr. Streamer.app"
          hdiutil detach "$mount"
          node test/e2e/packaged-app.ts "/Applications/Mr. Streamer.app/Contents/MacOS/Mr. Streamer" -- --use-mock-keychain

      - name: Smoke test the installed app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          node test/e2e/packaged-app.ts "$env:LOCALAPPDATA\Programs\mr-streamer\Mr. Streamer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the installed app on Linux
        if: runner.os == 'Linux'
        run: |
          # AppImages need FUSE 2, as on a user's Ubuntu.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2t64 ./dist/*.deb
          xvfb-run -a node test/e2e/packaged-app.ts "/opt/Mr. Streamer/mr-streamer" -- --no-sandbox
          xvfb-run -a node test/e2e/packaged-app.ts dist/*.AppImage -- --no-sandbox

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: Release
    needs: [plan, package]
    if: needs.plan.outputs.dry-run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      # The installers contain FFmpeg and x264 under the GPL; their exact sources ship alongside.
      - name: Add the FFmpeg and x264 sources
        run: |
          eval "$(grep -E '^(FFMPEG_VERSION|FFMPEG_SHA256|X264_COMMIT)=' scripts/build-ffmpeg.sh)"
          curl -sSfL -o "release/ffmpeg-$FFMPEG_VERSION.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  release/ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum -c -
          git init -q x264 && git -C x264 fetch -q --depth 1 https://code.videolan.org/videolan/x264.git "$X264_COMMIT"
          git -C x264 archive --format=tar.gz --prefix="x264-$X264_COMMIT/" -o "../release/x264-$X264_COMMIT.tar.gz" FETCH_HEAD
      - name: Write checksums and notes
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt)
          # Notes list the changes since the previous release of the same channel.
          prerelease=$([ "$CHANNEL" = nightly ] && echo true || echo false)
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq "[.[] | select((.isDraft | not) and .isPrerelease == $prerelease)][0].tagName // empty")
          {
            echo "**${CHANNEL^}** · built from \`${GITHUB_SHA::12}\`"
            echo
            echo "Download the DMG on Mac, the setup .exe on Windows, and the AppImage or .deb on Linux. SHA256SUMS.txt lists every file's checksum."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              ${previous:+-f previous_tag_name="$previous"} --jq .body
          } > notes.md
      # Nightlies go out as pre-releases right away; stable releases wait as drafts for testing.
      - name: Create the release
        run: |
          if [ "$CHANNEL" = nightly ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--draft)
          fi
          gh release create "$TAG" release/* "${flags[@]}" --target "$GITHUB_SHA" \
            --title "Mr. Streamer $VERSION" --notes-file notes.md

  next-version:
    name: Move main to the next version
    needs: [plan, release]
    if: needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set the next minor version on main
        run: |
          current=$(node -p 'require("./package.json").version')
          next=$(node -p "const [major, minor] = process.env.VERSION.split('.').map(Number); major + '.' + (minor + 1) + '.0'")
          if [ "$(printf '%s\n' "$current" "$next" | sort -V | tail -1)" = "$current" ]; then
            echo "main is already at $current."
            exit 0
          fi
          npm pkg set version="$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): start $next after releasing $VERSION"
          git push origin HEAD:main
