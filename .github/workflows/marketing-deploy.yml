# Publishes the website, apps/marketing, to mrstreamer.app on Vercel: after a push to main that
# changes what the page is built from, or by hand from main. apps/marketing/README.md has the
# setup, the first publication and how to turn it off.
#
# Off until the repository variable MARKETING_DEPLOY_ENABLED is "true": until then a run builds,
# says that publishing is off, and stops. Turned on, it needs the marketing-production
# environment, limited to main, with the secret VERCEL_TOKEN and the variables VERCEL_ORG_ID and
# VERCEL_PROJECT_ID.
#
# - Only main publishes: no pull request event starts this workflow, so no fork's code runs near
#   the token.
# - The build job has no secrets. It builds main as it is when the job starts, checks the package
#   (apps/marketing/scripts/package-vercel.ts) and hands over only .vercel/output.
# - The publish job checks out nothing: it holds that package and the token, and runs the pinned
#   Vercel CLI on it.
# - One publication at a time. A run that waited builds the newest main; one whose build main has
#   since overtaken leaves publishing to the run that change started.
#
# The Vercel project has no Git connection and an empty Root Directory: Vercel builds nothing
# itself, and this workflow is the only thing that publishes.
name: Marketing deploy

on:
  push:
    branches: [main]
    # What the page is built from. MARKETING_INPUTS below names the same files.
    paths:
      - apps/marketing/**
      - docs/assets/**
      - apps/desktop/assets/brand/mark.svg
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/marketing.yml
      - .github/workflows/marketing-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: marketing-production
  cancel-in-progress: false

env:
  MARKETING_INPUTS: '^(apps/marketing/|docs/assets/|apps/desktop/assets/brand/mark\.svg$|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/marketing(-deploy)?\.yml$)'

jobs:
  build:
    name: Build and check
    # A run started by hand from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # main as it is now, which a run that waited its turn finds newer than the push behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Note the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mrstreamer-marketing...
      - name: Build and check the package
        run: pnpm --filter mrstreamer-marketing build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-output
          path: apps/marketing/.vercel/output/
          # The package sits in a folder whose name starts with a dot.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Say that publishing is off
        if: vars.MARKETING_DEPLOY_ENABLED != 'true'
        run: |
          {
            echo "### Not published"
            echo "The website built, and publishing is off: the repository variable \`MARKETING_DEPLOY_ENABLED\` isn't \`true\`."
            echo "\`apps/marketing/README.md\` lists what to set up first."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: build
    if: vars.MARKETING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: marketing-production
      url: https://mrstreamer.app
    steps:
      - name: Check the setup
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("the secret VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("the variable VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("the variable VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::The marketing-production environment lacks ${list%, }."
            exit 1
          fi
      - name: Leave it to a newer run when main changed the website since the build
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BUILT...main" --paginate --jq '.files[]?.filename')
          if grep -Eq "$MARKETING_INPUTS" <<<"$changed"; then
            echo "::notice::main changed the website after $BUILT was built. The run for that change publishes it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.newest.outputs.superseded != 'true'
        with:
          name: marketing-output
          path: apps/marketing/.vercel/output
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.newest.outputs.superseded != 'true'
        with:
          node-version: 24
      # The project and account come from VERCEL_PROJECT_ID and VERCEL_ORG_ID. --prebuilt uploads
      # the package as it is, and Vercel runs no build. Only this step and the check hold the token.
      - name: Publish
        if: steps.newest.outputs.superseded != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          url=$(npx --yes vercel@62.2.0 deploy --prebuilt --prod --cwd apps/marketing --token "$VERCEL_TOKEN")
          echo "Published $BUILT as $url" >> "$GITHUB_STEP_SUMMARY"
