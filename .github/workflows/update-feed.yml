# Publishes the update feed, updates.json at the root of the GitHub Pages site, which names the
# newest release on each channel. The app reads it to find updates; the files stay on GitHub
# Releases. docs/maintainers/releasing.md describes the feed.
#
# - After every published nightly and stable release, called by release.yml.
# - By hand, to regenerate it, with allow-regress after deleting a bad release.
#
# Pages must be enabled once, with source "GitHub Actions". Until then deploying fails.
name: Update feed

on:
  workflow_call:
    inputs:
      continue-on-error:
        description: Leave the calling run passing when this fails. The failure still shows on the job.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      allow-regress:
        description: Let a channel move to a lower version, after deleting a bad release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the update feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ inputs.continue-on-error == true }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Every publication waits for the one ahead of it and is never cancelled, so each reads the
    # releases after the previous one deployed.
    concurrency:
      group: update-feed
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Write the feed
        env:
          ALLOW_REGRESS: ${{ inputs.allow-regress == true }}
        run: |
          # The site's address, custom domain or not. None before Pages is enabled; any other
          # failure stops here, since without the deployed feed the releases could take a
          # channel back.
          if site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>"$RUNNER_TEMP/pages-error"); then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pages-error"; then
            echo "::warning::No GitHub Pages site found, so deploying will fail. Enable Pages: docs/maintainers/releasing.md#enabling-pages"
            site=""
          else
            echo "::error::Couldn't look up the GitHub Pages site: $(cat "$RUNNER_TEMP/pages-error"). Run this again."
            exit 1
          fi
          args=(--out site/updates.json)
          [ -n "$site" ] && args+=(--current "${site%/}/updates.json")
          [ "$ALLOW_REGRESS" = true ] && args+=(--allow-regress)
          mkdir -p site
          touch site/.nojekyll
          node scripts/release-plan.ts feed "${args[@]}"
      # Named per attempt, so re-running this job never meets the artifact of an earlier attempt.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
