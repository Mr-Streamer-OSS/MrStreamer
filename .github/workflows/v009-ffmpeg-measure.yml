# Temporary matched benchmark on this task branch. Removed before the final PR.
name: Measure complete FFmpeg setup
on:
  push:
    branches: [t3/v009-ci-ffmpeg]
permissions:
  contents: read
jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, cold]
        sample: [1, 2, 3]
    steps:
      - name: Start measurement
        run: date +%s%3N > "$RUNNER_TEMP/job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: key
        run: |
          date +%s%3N > "$RUNNER_TEMP/tools-start"
          sources=$(find /etc/apt/sources.list.d -type f -exec sha256sum {} + | sha256sum | cut -d' ' -f1)
          echo "key=v009-measure-${{ github.run_id }}-${{ matrix.sample }}-${ImageOS}-${ImageVersion}-$sources-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"
          printf 'mode=%s sample=%s ImageOS=%s ImageVersion=%s source=%s\n' '${{ matrix.mode }}' '${{ matrix.sample }}' "$ImageOS" "$ImageVersion" '${{ github.sha }}' > "$RUNNER_TEMP/measurement.txt"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.mode == 'cold'
        with:
          path: |
            ${{ runner.temp }}/ffmpeg-packages/*.deb
            ${{ runner.temp }}/ffmpeg-packages/SHA256SUMS
          key: ${{ steps.key.outputs.key }}
      - name: Complete multimedia setup
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          if [[ "$MODE" == cold ]]; then
            bash apps/desktop/scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-packages" | tee "$RUNNER_TEMP/tools.txt"
          else
            start=$(date +%s%3N)
            sudo apt-get update -qq
            echo "ffmpeg-setup apt_index_ms=$(( $(date +%s%3N) - start ))" | tee "$RUNNER_TEMP/tools.txt"
            start=$(date +%s%3N)
            sudo apt-get install -y -qq ffmpeg
            echo "ffmpeg-setup package_install_ms=$(( $(date +%s%3N) - start ))" | tee -a "$RUNNER_TEMP/tools.txt"
            ffmpeg -version | tee -a "$RUNNER_TEMP/tools.txt"
            ffprobe -version | tee -a "$RUNNER_TEMP/tools.txt"
            ffmpeg -hide_banner -encoders | tee -a "$RUNNER_TEMP/tools.txt"
            ffmpeg -hide_banner -decoders | tee -a "$RUNNER_TEMP/tools.txt"
            ffmpeg -hide_banner -muxers | tee -a "$RUNNER_TEMP/tools.txt"
          fi
          echo "tools_with_cache_ms=$(( $(date +%s%3N) - $(cat "$RUNNER_TEMP/tools-start") ))" | tee -a "$RUNNER_TEMP/measurement.txt"
      - name: Full behavioral suite
        run: pnpm test --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/results.json"
      - name: Required multimedia coverage
        if: always()
        run: node apps/desktop/scripts/ci-multimedia-results.ts "$RUNNER_TEMP/results.json"
      - name: End measurement
        if: always()
        run: echo "job_until_checks_ms=$(( $(date +%s%3N) - $(cat "$RUNNER_TEMP/job-start") ))" >> "$RUNNER_TEMP/measurement.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ffmpeg-${{ matrix.mode }}-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/measurement.txt
            ${{ runner.temp }}/tools.txt
            ${{ runner.temp }}/results.json
  warm:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Start measurement
        run: date +%s%3N > "$RUNNER_TEMP/job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: key
        run: |
          date +%s%3N > "$RUNNER_TEMP/tools-start"
          sources=$(find /etc/apt/sources.list.d -type f -exec sha256sum {} + | sha256sum | cut -d' ' -f1)
          echo "key=v009-measure-${{ github.run_id }}-${{ matrix.sample }}-${ImageOS}-${ImageVersion}-$sources-${{ hashFiles('apps/desktop/scripts/ci-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"
          printf 'mode=warm sample=%s ImageOS=%s ImageVersion=%s source=%s\n' '${{ matrix.sample }}' "$ImageOS" "$ImageVersion" '${{ github.sha }}' > "$RUNNER_TEMP/measurement.txt"
      - id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/ffmpeg-packages/*.deb
            ${{ runner.temp }}/ffmpeg-packages/SHA256SUMS
          key: ${{ steps.key.outputs.key }}
      - name: Require a matched warm image and package set
        env:
          HIT: ${{ steps.packages.outputs.cache-hit }}
        run: test "$HIT" = true
      - name: Complete multimedia setup
        run: |
          set -o pipefail
          bash apps/desktop/scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg-packages" | tee "$RUNNER_TEMP/tools.txt"
          echo "tools_with_cache_ms=$(( $(date +%s%3N) - $(cat "$RUNNER_TEMP/tools-start") ))" | tee -a "$RUNNER_TEMP/measurement.txt"
      - name: Full behavioral suite
        run: pnpm test --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/results.json"
      - name: Required multimedia coverage
        if: always()
        run: node apps/desktop/scripts/ci-multimedia-results.ts "$RUNNER_TEMP/results.json"
      - name: End measurement
        if: always()
        run: echo "job_until_checks_ms=$(( $(date +%s%3N) - $(cat "$RUNNER_TEMP/job-start") ))" >> "$RUNNER_TEMP/measurement.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ffmpeg-warm-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/measurement.txt
            ${{ runner.temp }}/tools.txt
            ${{ runner.temp }}/results.json
