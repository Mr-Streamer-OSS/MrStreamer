# Sends a stable release's Microsoft Store package to Partner Center through Microsoft's Store
# submission API, and reads back what the Store did with it. docs/maintainers/microsoft-store.md
# has the setup, the rules a submission follows and what to do when one fails.
#
# - After a stable release: build-release.yml calls this once the release is published and its
#   package passed every check. Nightlies, dry runs, pushes and tags never get here.
# - By hand, from main. preflight checks the account, the listing and what a submission would do.
#   status reads where a release's submission stands. submit sends a published release's package
#   when the release's own run couldn't. preflight and status only read.
#
# Off until the owner turns it on. Submitting needs the repository variable
# STORE_AUTOMATION_ENABLED to be "true". Every action needs the microsoft-store environment,
# limited to main, with the variables STORE_TENANT_ID, STORE_CLIENT_ID and
# STORE_CLIENT_SECRET_EXPIRES and the secret STORE_CLIENT_SECRET. The gate job reads that setup
# before any job names the environment: GitHub creates a missing environment, open to every
# branch, for the first job that names it.
#
# - The Store job runs main's scripts with node alone. It installs no packages and never checks
#   out the release's commit, and only its last step holds the credential.
# - The package is the one the release run built and tested, taken from that run's artifact and
#   never built again. The steps before the last check the release, its commit, the run and the
#   package.
# - One Store job at a time for the whole product, whoever started it, and none is cancelled.
name: Microsoft Store

# What a run started by hand is called in the list of runs.
run-name: Microsoft Store ${{ inputs.action }} ${{ inputs.version }}

on:
  workflow_call:
    inputs:
      version:
        description: The stable release just published
        type: string
        required: true
      sha:
        description: The commit the release was built from
        type: string
        required: true
      sha256:
        description: The package's checksum, from the job that built it
        type: string
        required: true
  workflow_dispatch:
    inputs:
      action:
        description: preflight and status only read. submit sends a release's package.
        type: choice
        options: [preflight, status, submit]
        default: preflight
      version:
        description: A published stable release, such as 0.0.5. Required for status and submit.
        type: string
        required: false

permissions:
  contents: read

env:
  # A release's own run names no action: it submits.
  ACTION: ${{ inputs.action || 'submit' }}
  VERSION: ${{ inputs.version }}
  # Set by a release's own run alone: the commit it built.
  SHA: ${{ inputs.sha }}

jobs:
  gate:
    name: Check the Store setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the environment's branch rule.
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # While submissions are off, a release's run stops here with a notice and stays green.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.STORE_AUTOMATION_ENABLED }}
        run: |
          args=(--action "$ACTION" --ref "$GITHUB_REF" --enabled "$ENABLED")
          [ -n "$SHA" ] && args+=(--release-run)
          node scripts/store-release.ts gate "${args[@]}"

  store:
    name: Microsoft Store
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: microsoft-store
    # Every Store job waits for the one ahead of it, so each reads the Store after the previous
    # one is done with it.
    concurrency:
      group: microsoft-store
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      # Finds a release run's package when started by hand.
      actions: read
    steps:
      # main's scripts: the commit the run started from, never the release's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # A release's own run takes the package it built. Started by hand, the script finds the
      # release run that still holds it. status needs no package.
      - name: Check the release
        id: release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--version "$VERSION" --out "$RUNNER_TEMP/store-release.json")
          [ -n "$SHA" ] && args+=(--sha "$SHA" --run "$GITHUB_RUN_ID")
          [ "$ACTION" != status ] && args+=(--package)
          node scripts/store-release.ts release "${args[@]}"
      # Another run's artifact needs the token; this run's own doesn't.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.release.outputs.run-id != ''
        with:
          name: msix-${{ inputs.version }}
          path: ${{ runner.temp }}/msix
          run-id: ${{ steps.release.outputs.run-id }}
          github-token: ${{ steps.release.outputs.run-id != github.run_id && github.token || '' }}
      - name: Check the package
        if: steps.release.outputs.run-id != ''
        env:
          SHA256: ${{ inputs.sha256 }}
        run: |
          args=(--release "$RUNNER_TEMP/store-release.json" --dir "$RUNNER_TEMP/msix")
          [ -n "$SHA" ] && args+=(--sha256 "$SHA256")
          node scripts/store-release.ts verify "${args[@]}"
      # The only step that holds the credential.
      - name: Microsoft Store
        env:
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_CLIENT_SECRET_EXPIRES: ${{ vars.STORE_CLIENT_SECRET_EXPIRES }}
        run: |
          args=()
          [ -n "$VERSION" ] && args+=(--release "$RUNNER_TEMP/store-release.json")
          node scripts/store-submission.ts "$ACTION" "${args[@]}"
