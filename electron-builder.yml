# Installers: an arm64 DMG for Apple Silicon Macs (`pnpm dist:mac`, on a Mac), an x64 NSIS installer
# for Windows 11 (`pnpm dist:win`, on any system; Linux fetches its own Wine for it), and an x64
# AppImage and deb for Linux (`pnpm dist:linux`, on Linux).
appId: io.github.stienswout.mrstreamer
productName: Mr. Streamer
copyright: Copyright © 2026 Wout Stiens
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
electronLanguages: [en]
# Seals Mac builds with an ad hoc signature, so they open without a Developer ID. See the script.
afterPack: ./scripts/mac-ad-hoc-sign.ts

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.entertainment
  icon: build/icon.icns
  # Signs with a Developer ID from the login keychain when one exists; otherwise the afterPack
  # hook's ad hoc signature stays.
  # Notarization runs only when APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Mr-Streamer-${version}-mac-${arch}.${ext}
dmg:
  title: Mr. Streamer ${version}
  contents:
    - { x: 160, y: 200, type: file }
    - { x: 480, y: 200, type: link, path: /Applications }

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Mr-Streamer-${version}-win-${arch}-setup.${ext}
nsis:
  # Per-user install into %LOCALAPPDATA%, no admin prompt. Uninstalling keeps the login and preferences.
  oneClick: true
  perMachine: false
  shortcutName: Mr. Streamer
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  synopsis: A cinematic player for your existing IPTV subscriptions.
  maintainer: Wout Stiens <woutstoens@gmail.com>
  artifactName: Mr-Streamer-${version}-linux-${arch}.${ext}
